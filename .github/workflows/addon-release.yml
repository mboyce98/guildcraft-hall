# Uploads the in-game addon to CurseForge when a tag like "addon-v1.0.1" is pushed
# (or when run by hand from the Actions tab).
# Needs, in GitHub → Settings → Secrets and variables → Actions:
#   secret   CF_API_KEY     a CurseForge API token (curseforge.com → account → API tokens)
#   variable CF_PROJECT_ID  the number shown as "Project ID" on the CurseForge project page
# Optional variable CF_GAME_VERSION (default "1.60.1", the WoW Forever version on CurseForge).
name: Release addon to CurseForge

on:
  push:
    tags: ["addon-v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip
        run: |
          if [[ "$GITHUB_REF_NAME" == addon-v* ]]; then
            VERSION="${GITHUB_REF_NAME#addon-v}"
          else
            VERSION="$(sed -n 's/^## Version: *//p' addon/BarkAndStone/BarkAndStone.toc | tr -d '\r')"
          fi
          sed -i "s/^## Version: .*/## Version: $VERSION/" addon/BarkAndStone/*.toc
          sed -i "s/^local VERSION = \".*\"/local VERSION = \"$VERSION\"/" addon/BarkAndStone/BarkAndStone.lua
          (cd addon && zip -rq "../BarkAndStone-$VERSION.zip" BarkAndStone)
          unzip -l "BarkAndStone-$VERSION.zip"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
          CF_GAME_VERSION: ${{ vars.CF_GAME_VERSION || '1.60.1' }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::error::Add the CF_API_KEY secret and the CF_PROJECT_ID variable first (see the top of this file)."; exit 1
          fi
          curl -sf -H "X-Api-Token: $CF_API_KEY" https://wow.curseforge.com/api/game/versions > versions.json
          GV="$(jq -c --arg v "$CF_GAME_VERSION" '[.[] | select(.name == $v) | .id]' versions.json)"
          if [ "$GV" = "[]" ]; then
            echo "::error::CurseForge has no game version named $CF_GAME_VERSION. Versions that look like Forever:"
            jq -r '.[] | select(.name | test("^1\\.6")) | .name' versions.json | sort -u
            exit 1
          fi
          META="$(jq -n --arg log "$(cat addon/CHANGELOG.md)" --arg name "Bark and Stone $VERSION" --argjson gv "$GV" \
            '{changelog: $log, changelogType: "markdown", displayName: $name, gameVersions: $gv, releaseType: "release"}')"
          curl -sf -H "X-Api-Token: $CF_API_KEY" \
            --form-string "metadata=$META" \
            -F "file=@BarkAndStone-$VERSION.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
          echo
          echo "Uploaded Bark and Stone $VERSION to CurseForge."
